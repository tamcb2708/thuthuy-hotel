name: Deploy GitHub Pages

# Pages được cấu hình lấy nguồn từ nhánh gh-pages.
# Workflow này đồng bộ nội dung main -> gh-pages mỗi khi push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push main to gh-pages
        run: git push --force origin HEAD:gh-pages
